<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>(()=>{const v=new URLSearchParams(location.search).get('theme');const t=v==='interview'?'interview':'daily';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t==='interview'?'dark':'light'})()</script>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d1a1f" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>About Chat — YI:ON</title>
    <meta name="description" content="YI:ON과 대화하며 전이현의 취향, 성격, 가치관과 일상을 알아보세요." />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js" defer></script>
  </head>
  <body data-page="chat-about" data-shell="stack">
    <svg style="display: none">
      <symbol id="icon-ribbon" viewBox="0 0 24 24">
        <path d="M12 13.2c-1.6-2-4.6-3.6-7.4-3.1C2.7 10.5 1.6 12 2 13.4c.5 1.7 2.6 2.3 4.4 1.9 1.9-.4 3.9-1.3 5.6-2.1zm0 0c1.6-2 4.6-3.6 7.4-3.1 1.9.4 3 1.9 2.6 3.3-.5 1.7-2.6 2.3-4.4 1.9-1.9-.4-3.9-1.3-5.6-2.1zm0 0v7.4M10.6 20.6h2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-heart" viewBox="0 0 24 24">
        <path d="M12 20.2s-7.6-4.6-9.8-9.3C.6 7.4 2.4 4 5.9 3.6c2-.2 3.8.9 4.9 2.6 1.1-1.7 3-2.8 4.9-2.6 3.5.4 5.3 3.8 3.7 7.3-2.2 4.7-9.8 9.3-9.8 9.3z"/>
      </symbol>
    </svg>

    <header class="site-header">
      <a class="brand" href="index.html">
        <svg class="icon icon-ribbon" width="16" height="16"><use href="#icon-ribbon"/></svg>
        YI:ON
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-nav="home">Home</a>
        <a href="about.html" data-nav="about">About</a>
        <a href="projects.html" data-nav="projects">Projects</a>
        <a href="journey.html" data-nav="journey">Journey</a>
        <a href="research.html" data-nav="research">Research</a>
        <a href="awards.html" data-nav="awards">Awards</a>
        <a href="archive.html" data-nav="archive">Archive</a>
        <a href="contact.html" data-nav="contact">Contact</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main>
      <div class="chat-page" id="chatPage">
        <header class="chat-topbar">
          <button class="app-back-btn" id="chatBackBtn" type="button" aria-label="뒤로가기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="chat-topbar-info">
            <span class="ai-avatar">YI</span>
            <div>
              <p class="chat-label">YI:ON Assistant</p>
              <span class="status-pill-sm">Online</span>
            </div>
          </div>
          <button class="chat-reset-btn" id="chatResetBtn" type="button" aria-label="대화 초기화">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
          </button>
        </header>

        <div class="chat-hero" id="chatHero">
          <div class="message ai-message chat-hero-message" id="chatHeroMessage"></div>
          <button class="chat-hint-chip" id="chatHintChip" type="button">
            <span aria-hidden="true">💡</span> <span id="chatHintText"></span>
          </button>
        </div>

        <div class="chat-messages-wrap">
          <div class="chat-messages" id="chatLog"></div>
          <button class="chat-jump-latest" id="chatJumpLatest" type="button" hidden>↓ 최신 메시지</button>
        </div>

        <form class="chat-composer" id="chatForm">
          <textarea id="chatInput" rows="1" placeholder="" autocomplete="off"></textarea>
          <button type="submit" class="chat-send-btn" aria-label="질문 보내기">↑</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <span>© YI:ON</span>
      <svg class="icon icon-heart" width="12" height="12"><use href="#icon-heart"/></svg>
    </footer>

    <nav class="app-tabbar" id="appTabbar" aria-label="주요 메뉴">
      <a class="app-tab" data-tab="home" href="index.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>Home</span>
      </a>
      <a class="app-tab" data-tab="projects" href="projects.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        <span>Projects</span>
      </a>
      <a class="app-tab" data-tab="chat" href="chat.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>Chat</span>
      </a>
      <a class="app-tab" data-tab="profile" href="about.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span>Profile</span>
      </a>
    </nav>

    <script src="data/projects.js"></script>
    <script src="data/papers.js"></script>
    <script src="data/awards.js"></script>
    <script src="data/activities.js"></script>
    <script src="data/presentations.js"></script>
    <script src="data/chat-engine.js"></script>
    <script src="script.js"></script>
    <script src="data/chat-shell.js"></script>
    <script>
      window.initYionChatShell({
        pageMode: 'general',
        historyStorageKey: 'yion_chat_about_v1',
        heroLines: [
          '안녕하세요, 저는 YI:ON이에요.',
          '전이현의 취향, 성격, 가치관과 일상에 대해 대신 이야기해드려요.',
          '편하게 궁금한 것을 물어보세요.',
        ],
        placeholder: '전이현의 취향이나 성격을 물어보세요.',
        hintItems: [
          { label: '성격', question: '성격은 어떤가요?', placeholder: '전이현의 성격이나 취향을 물어보세요.' },
          { label: '취향', question: '어떤 취향을 가지고 있나요?', placeholder: '예: 어떤 음악을 좋아하나요?' },
          { label: '좋아하는 음악', question: '좋아하는 음악은?', placeholder: '좋아하는 음악을 물어보세요.' },
          { label: '여행', question: '여행을 좋아하나요?', placeholder: '여행 이야기를 물어보세요.' },
          { label: '버킷리스트', question: '버킷리스트는?', placeholder: '버킷리스트를 물어보세요.' },
        ],
      });
    </script>
  </body>
</html>
